# fightme.pro -> Foundry VTT (127.0.0.1:30000). Apex 301-redirects to www.
# System nginx terminates TLS (certbot --nginx adds the 443 blocks + redirect).
# $connection_upgrade is defined globally in /etc/nginx/conf.d/ws-upgrade.conf.
server {
    listen 80;
    listen [::]:80;
    server_name fightme.pro;
    return 301 https://www.fightme.pro$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.fightme.pro;

    # Foundry uploads worlds/assets; no body-size cap.
    client_max_body_size 0;
    proxy_buffering off;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:30000;
    }
}
