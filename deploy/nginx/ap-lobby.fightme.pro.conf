# Archipelago lobby — ap-lobby.fightme.pro -> ap-lobby container (127.0.0.1:8001).
# System nginx terminates TLS (certbot --nginx adds the 443 block + redirect).
# $connection_upgrade is defined globally in /etc/nginx/conf.d/ws-upgrade.conf.
server {
    listen 80;
    listen [::]:80;
    server_name ap-lobby.fightme.pro;

    # Headroom for YAML uploads and full-seed uploads (upload_generation).
    client_max_body_size 512m;
    proxy_buffering off;

    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:8001;
    }
}
