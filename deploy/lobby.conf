# Archipelago lobby — gerbera-jamesoniium.com -> ap-lobby container.
# The ap-lobby container is on the foundry_default docker network (joined as the
# `proxy` network in deploy/docker-compose.prod.yml), so SWAG resolves it by name.
# NOTE: the `map $http_upgrade $connection_upgrade` is already defined in
# foundryvtt.conf at http scope — do not redefine it here.

# Redirect www -> apex so the Discord OAuth redirect_uri always matches.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.gerbera-jamesoniium.com;

    include /config/nginx/ssl.conf;

    return 301 https://gerbera-jamesoniium.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gerbera-jamesoniium.com;

    include /config/nginx/ssl.conf;

    # Headroom for YAML uploads and full-seed uploads (upload_generation, up to 512 MiB).
    client_max_body_size 512m;
    proxy_buffering off;

    location / {
        include /config/nginx/proxy.conf;

        resolver 127.0.0.11 valid=30s;

        set $upstream_proto http;
        set $upstream_app ap-lobby;
        set $upstream_port 8000;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
